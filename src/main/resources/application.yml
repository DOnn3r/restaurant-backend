server:
  port: 8080

spring:
  application:
    name: restaurant-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/restaurant}
    username: ${DB_USER:restaurant}
    password: ${DB_PASSWORD:restaurant}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Base déjà créée avant Flyway (ancien ddl-auto=update) : elle est adoptée telle quelle comme version 1.
    # Sans effet sur une base vide, qui reçoit V1__init.sql normalement.
    baseline-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      # Le schéma est géré par Flyway (src/main/resources/db/migration) : Hibernate se contente de le vérifier.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  timezone: ${APP_TIMEZONE:Indian/Antananarivo}
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-0123}
    expiration-hours: ${JWT_EXPIRATION_HOURS:12}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin1234}
